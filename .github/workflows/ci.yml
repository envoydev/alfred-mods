name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The build each release was checked against; a release moves it
  CLAUDE_CODE_VERSION: 2.1.318
  TYPESCRIPT_VERSION: 6.0.3
  # Keep the pinned CLI from updating itself or sending telemetry
  DISABLE_AUTOUPDATER: 1
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1

jobs:
  # `claude plugin test` runs with no session, sign-in or network, so no secret is needed
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"

      - name: claude --version
        run: claude --version

      - name: npm run validate
        run: npm run validate

      - name: npm test
        run: npm test

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"
          claude --version

      # tsc needs .claude-plugin/types/, which Claude Code writes only when an interactive session loads the mod from
      # --plugin-dir. A throwaway config marks onboarding done and this folder trusted, so the session starts with no
      # credentials and makes no model call; it is stopped once the types for the pinned build are on disk.
      # From claude-flightdeck's ci.yml (f9c3c52), 'Write the API types'.
      - name: Write the API types
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          TERM: xterm-256color
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          printf '{"hasCompletedOnboarding":true,"theme":"dark","projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' \
            "$(pwd -P)" > "$CLAUDE_CONFIG_DIR/.claude.json"
          screen="$RUNNER_TEMP/claude-screen.log"
          # sleep keeps stdin open, so script never hands the session an EOF
          setsid bash -c "sleep 300 | script -qfc 'claude --plugin-dir .' '$screen'" > /dev/null 2>&1 &
          pid=$!
          types=.claude-plugin/types
          for _ in $(seq 60); do
            if [ -f "$types/tsconfig.json" ] && head -n 1 "$types/claude-code/index.d.ts" 2> /dev/null \
              | grep -qF "Written by Claude Code $CLAUDE_CODE_VERSION."; then
              break
            fi
            sleep 1
          done
          sleep 1
          kill -TERM -- "-$pid" 2> /dev/null || true
          wait "$pid" 2> /dev/null || true
          if ! head -n 1 "$types/claude-code/index.d.ts" 2> /dev/null | grep -qF "Written by Claude Code $CLAUDE_CODE_VERSION."; then
            echo "::error::Claude Code did not write $types/ for $CLAUDE_CODE_VERSION. Its screen:"
            cat -v "$screen" 2> /dev/null | tail -c 4000
            exit 1
          fi
          ls -R "$types"

      - name: tsc -p .
        run: npx -y -p "typescript@${{ env.TYPESCRIPT_VERSION }}" tsc -p .
